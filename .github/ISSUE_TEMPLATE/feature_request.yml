name: Feature request
description: Propose a focused storefront or theme improvement
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Describe the storefront, content, accessibility, SEO, or performance need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain the smallest useful implementation and important trade-offs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and risk
      description: Note WooCommerce, responsive, accessibility, SEO, performance, or browser considerations.
